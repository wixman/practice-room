/* ================= cloud sync (Supabase, plain REST) =================
   The device keeps a full copy in IndexedDB; Supabase holds the shared copy.
   items: one row per piece / collection / settings (JSON), files: score XML and MIDI per piece (gzipped, base64).
   Conflicts: the newer edit wins per record, and Play/Practice history is merged so no run is lost. */
const LOCAL_ONLY_SETTINGS=["latency","showKbd"]; // device-specific
const Cloud={ cfg:null, state:"off", detail:"", busy:false, timer:null, again:false,
  load(){ try{ this.cfg=JSON.parse(localStorage.getItem("pr-cloud")||"null"); }catch(e){ this.cfg=null; } },
  save(){ try{ localStorage.setItem("pr-cloud",JSON.stringify(this.cfg)); }catch(e){} },
  get on(){ return !!(this.cfg&&this.cfg.session&&this.cfg.url&&this.cfg.key); },
  setState(st,detail=""){ this.state=st; this.detail=detail; renderCloudPill(); const el=$("#acctStatus"); if(el) el.textContent=cloudStatusText(); },
  /* --- HTTP --- */
  async req(path,{method="GET",body,headers={},auth=true}={}){
    const c=this.cfg; if(auth&&c.session.expires_at&&c.session.expires_at*1000<Date.now()+60000) await this.refresh();
    const go=()=>fetch(c.url+path,{method,headers:{apikey:c.key,"Content-Type":"application/json",...(auth?{Authorization:"Bearer "+c.session.access_token}:{}),...headers},body:body===undefined?undefined:JSON.stringify(body)});
    let r=await go();
    if(r.status===401&&auth){ await this.refresh(); r=await go(); }
    const txt=await r.text(); let data=null; try{ data=txt?JSON.parse(txt):null; }catch(e){ data=txt; }
    if(!r.ok){ const msg=(data&&(data.msg||data.message||data.error_description||data.error))||`Request failed (${r.status})`; const err=new Error(msg); err.status=r.status; throw err; }
    return data;
  },
  async refresh(){ const c=this.cfg;
    const r=await fetch(c.url+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:c.key,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:c.session.refresh_token})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||!d.access_token){ const e=new Error("Your sign-in expired. Sign in again to keep syncing."); e.signedOut=true; throw e; }
    c.session=pickSession(d,c.session); this.save(); },
  /* --- account --- */
  async signIn({url,key,email,password,create}){
    url=url.trim().replace(/\/+$/,""); key=key.trim();
    if(!/^https:\/\/[^/]+$/.test(url)&&!/^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(url)) throw new Error("The project URL should look like https://abcdefgh.supabase.co");
    const r=await fetch(url+(create?"/auth/v1/signup":"/auth/v1/token?grant_type=password"),{method:"POST",headers:{apikey:key,"Content-Type":"application/json"},body:JSON.stringify({email:email.trim(),password})}).catch(()=>{ throw new Error("Couldn't reach that project. Check the URL and your connection."); });
    const d=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.msg||d.error_description||d.message||d.error||`Sign-in failed (${r.status})`);
    if(!d.access_token) throw new Error("Account created. Confirm it from the email Supabase sent, then sign in. (Or turn off “Confirm email” in Supabase so this step isn't needed.)");
    this.cfg={url,key,session:pickSession(d),cursor:null,lastSync:null}; this.save();
    await this.sync(true);
  },
  signOut(){ if(this.cfg){ const {url,key}=this.cfg; this.cfg={url,key}; this.save(); } this.setState("off"); },
  /* --- scheduling --- */
  soon(){ if(!this.on) return; clearTimeout(this.timer); this.timer=setTimeout(()=>this.sync(),1500); },
  async sync(first=false){
    if(!this.on) { this.setState("off"); return; }
    if(this.busy){ this.again=true; return; }
    this.busy=true; this.setState("syncing");
    try{ await this.pull(); await this.push(); this.cfg.lastSync=Date.now(); this.save(); this.setState("ok"); }
    catch(e){ console.warn("sync",e);
      if(e.signedOut){ this.signOut(); this.setState("off",e.message); toast(e.message); }
      else this.setState(navigator.onLine===false||e instanceof TypeError?"offline":"error",e.message); }
    finally{ this.busy=false; if(this.again){ this.again=false; this.soon(); } }
  },
  /* --- pull: everything changed on the server since our last look --- */
  async pull(){
    const c=this.cfg; let changed=false; const needFiles=S.pieces.filter(p=>!p.sample&&(!p.xml||(p.midi&&!p.midi.b64)));
    const q=c.cursor?`&modified_at=gt.${encodeURIComponent(c.cursor)}`:"";
    const rows=await this.req(`/rest/v1/items?select=kind,id,data,updated,deleted,modified_at&order=modified_at.asc${q}`);
    for(const row of rows||[]){
      if(!c.cursor||row.modified_at>c.cursor) c.cursor=row.modified_at;
      if(row.kind==="piece"){
        const i=S.pieces.findIndex(p=>p.id===row.id), local=S.pieces[i];
        if(row.deleted){ if(local&&(local.updated||0)<=row.updated){ S.pieces.splice(i,1); await DB.del("pieces",row.id); changed=true; } continue; }
        const d=row.data;
        if(!local){ const p={...d,xml:null,_synced:row.updated}; if(p.midi) p.midi={name:p.midi.name,b64:null}; S.pieces.push(p); needFiles.push(p); changed=true; continue; }
        const merged=mergeAttempts(local.attempts,d.attempts); const ml=mergeLearn(local.learn,d.learn);
        const attemptsGrew=merged.length>(local.attempts||[]).length||learnSig(ml)!==learnSig(local.learn);
        if(row.updated>(local.updated||0)){
          const keepXml= local.xmlRev===d.xmlRev ? local.xml : null; const keepMidi= local.midiRev===d.midiRev&&local.midi ? local.midi.b64 : null;
          const p={...d,attempts:merged,learn:ml,lastPlayed:Math.max(local.lastPlayed||0,d.lastPlayed||0)||null,plays:Math.max(local.plays||0,d.plays||0),xml:keepXml,
            midi:d.midi?{name:d.midi.name,b64:keepMidi}:undefined,updated:row.updated,_synced:row.updated,_xmlPushed:d.xmlRev,_midiPushed:d.midiRev};
          if(!p.midi) delete p.midi;
          if(merged.length>(d.attempts||[]).length||learnSig(ml)!==learnSig(d.learn)) p.updated=Date.now(); // we hold runs or medals the server hasn't seen yet
          S.pieces[i]=p; if(S.cur&&S.cur.id===p.id) S.cur=p; if(!keepXml||(p.midi&&!keepMidi)) needFiles.push(p); else await DB.put("pieces",p); changed=true;
        } else if(attemptsGrew){ local.attempts=merged; local.learn=ml; local.lastPlayed=Math.max(local.lastPlayed||0,d.lastPlayed||0)||null; await DB.put("pieces",local); changed=true; }
      } else if(row.kind==="collection"){
        const i=S.collections.findIndex(x=>x.id===row.id), local=S.collections[i];
        if(row.deleted){ if(local&&(local.updated||0)<=row.updated){ S.collections.splice(i,1); await DB.del("collections",row.id); changed=true; } continue; }
        if(!local||row.updated>(local.updated||0)){ const col={...row.data,updated:row.updated,_synced:row.updated}; if(local) S.collections[i]=col; else S.collections.push(col); await DB.put("collections",col); changed=true; }
      } else if(row.kind==="settings"){
        if(row.updated>(S.settings.updated||0)){ const keep={}; for(const k of LOCAL_ONLY_SETTINGS) keep[k]=S.settings[k];
          S.settings={...S.settings,...row.data,...keep,updated:row.updated,_synced:row.updated}; await DB.put("meta",{id:"settings",...S.settings}); Audio.setVolumes(); }
      }
    }
    // fetch score / MIDI files for pieces that are new or changed on another device
    for(let k=0;k<needFiles.length;k+=15){
      const batch=needFiles.slice(k,k+15); const ids=[];
      for(const p of batch){ if(!p.xml) ids.push(p.id+":xml"); if(p.midi&&!p.midi.b64) ids.push(p.id+":midi"); }
      if(ids.length) changed=true;
      const files=ids.length?await this.req(`/rest/v1/files?select=id,content&id=in.(${ids.map(x=>`"${x}"`).join(",")})`):[];
      const map=new Map((files||[]).map(f=>[f.id,f.content]));
      for(const p of batch){
        if(!p.xml){ const v=map.get(p.id+":xml"); if(v!=null) p.xml=await unpackText(v); }
        if(p.midi&&!p.midi.b64){ const v=map.get(p.id+":midi"); if(v!=null) p.midi.b64=await unpackText(v); else delete p.midi; }
        await DB.put("pieces",p); // a piece whose score hasn't arrived yet stays hidden and is fetched again next sync
      }
    }
    this.save();
    if(changed&&!$("#viewLibrary").hidden) renderLibrary();
  },
  /* --- push: local changes the server hasn't seen --- */
  async push(){
    const c=this.cfg, uidUser=c.session.user_id, rows=[], files=[], after=[];
    for(const p of S.pieces){ if(p.sample||!p.xml) continue;
      if(!p.updated) p.updated=p.added||Date.now();
      if(!p.xmlRev) p.xmlRev=uid();
      if(p.midi&&p.midi.b64&&!p.midiRev) p.midiRev=uid();
      if((p._synced||0)>=p.updated&&p._xmlPushed===p.xmlRev&&(!p.midi||p._midiPushed===p.midiRev)) continue;
      rows.push({user_id:uidUser,kind:"piece",id:p.id,data:pieceData(p),updated:p.updated,deleted:false});
      if(p._xmlPushed!==p.xmlRev) files.push({user_id:uidUser,id:p.id+":xml",content:await packText(p.xml)});
      if(p.midi&&p.midi.b64&&p._midiPushed!==p.midiRev) files.push({user_id:uidUser,id:p.id+":midi",content:p.midi.b64});
      after.push(()=>{ p._synced=p.updated; p._xmlPushed=p.xmlRev; p._midiPushed=p.midi?p.midiRev:undefined; return DB.put("pieces",p); });
    }
    for(const col of S.collections){ if(col.sample) continue; if(!col.updated) col.updated=col.created||Date.now(); if((col._synced||0)>=col.updated) continue;
      const {_synced,...data}=col; rows.push({user_id:uidUser,kind:"collection",id:col.id,data,updated:col.updated,deleted:false});
      after.push(()=>{ col._synced=col.updated; return DB.put("collections",col); }); }
    if((S.settings.updated||0)>(S.settings._synced||0)){ const {_synced,updated,...data}=S.settings; for(const k of LOCAL_ONLY_SETTINGS) delete data[k];
      rows.push({user_id:uidUser,kind:"settings",id:"settings",data,updated:S.settings.updated,deleted:false});
      after.push(()=>{ S.settings._synced=S.settings.updated; return DB.put("meta",{id:"settings",...S.settings}); }); }
    const tomb=await getTombstones();
    for(const t of tomb) rows.push({user_id:uidUser,kind:t.kind,id:t.id,data:{},updated:t.updated,deleted:true});
    // files first, so another device never sees a piece whose score isn't there yet
    for(let k=0;k<files.length;k+=5) await this.req("/rest/v1/files?on_conflict=user_id,id",{method:"POST",body:files.slice(k,k+5),headers:{Prefer:"resolution=merge-duplicates,return=minimal"}});
    for(let k=0;k<rows.length;k+=50) await this.req("/rest/v1/items?on_conflict=user_id,kind,id",{method:"POST",body:rows.slice(k,k+50),headers:{Prefer:"resolution=merge-duplicates,return=minimal"}});
    for(const f of after) await f();
    if(tomb.length) await DB.put("meta",{id:"tombstones",list:[]});
  }
};
function pickSession(d,prev={}){ return {access_token:d.access_token,refresh_token:d.refresh_token||prev.refresh_token,expires_at:d.expires_at||(d.expires_in?Math.floor(Date.now()/1000)+d.expires_in:null),user_id:(d.user&&d.user.id)||prev.user_id,email:(d.user&&d.user.email)||prev.email}; }
function pieceData(p){ const {xml,_synced,_xmlPushed,_midiPushed,...rest}=p; if(rest.midi) rest.midi={name:rest.midi.name}; return rest; }
function mergeLearn(a,b){ // medals: keep the earliest award, best score and most tries from either device
  const out={cells:{}}; for(const src of [a,b]) for(const [k,c] of Object.entries((src&&src.cells)||{})){ const o=out.cells[k];
    out.cells[k]= o ? {best:Math.max(o.best||0,c.best||0),tries:Math.max(o.tries||0,c.tries||0),earned:(o.earned&&c.earned)?Math.min(o.earned,c.earned):(o.earned||c.earned||null)} : {...c}; }
  const t=(a&&a.total)||(b&&b.total)||0; if(t){ out.total=t; out.earned=Object.values(out.cells).filter(c=>c.earned).length; }
  return out; }
const learnSig=l=>JSON.stringify(Object.entries((l&&l.cells)||{}).sort().map(([k,c])=>[k,c.best,c.tries,!!c.earned]));
function mergeAttempts(a=[],b=[]){ const seen=new Map(); for(const x of [...(a||[]),...(b||[])]) seen.set(x.date+"|"+x.mode,x); return [...seen.values()].sort((x,y)=>x.date-y.date).slice(-300); }
async function getTombstones(){ try{ const t=(await DB.all("meta")).find(x=>x.id==="tombstones"); return t?t.list:[]; }catch(e){ return []; } }
async function addTombstone(kind,id){ const list=await getTombstones(); list.push({kind,id,updated:Date.now()}); await DB.put("meta",{id:"tombstones",list}); Cloud.soon(); }
async function packText(txt){ // gzip + base64 keeps big MusicXML files small on the server
  if(typeof CompressionStream==="undefined") return "txt:"+txt;
  const buf=await new Response(new Blob([txt]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer(); return "gz:"+bufToB64(buf); }
async function unpackText(v){ if(v.startsWith("gz:")){ const out=await new Response(new Blob([b64ToBuf(v.slice(3))]).stream().pipeThrough(new DecompressionStream("gzip"))).text(); return out; }
  return v.startsWith("txt:")?v.slice(4):v; }
function cloudStatusText(){ const c=Cloud;
  if(!c.on) return c.detail||"Not signed in. Your library is only on this device.";
  if(c.state==="syncing") return "Syncing…";
  if(c.state==="offline") return "Offline. Changes are saved on this device and sync when you're back online.";
  if(c.state==="error") return "Sync problem: "+c.detail;
  return c.cfg.lastSync?`Synced ${ago(c.cfg.lastSync).replace(/^Played /,"")}`:"Signed in";
}
function renderCloudPill(){ const b=$("#cloudPill"); if(!b) return; const st=Cloud.on?Cloud.state:"off";
  b.className="pill cloud "+st; $("#cloudText").textContent= st==="off"?"Sign in to sync": st==="syncing"?"Syncing…": st==="offline"?"Offline": st==="error"?"Sync problem":"Synced"; }
function openAccount(){
  const c=Cloud.cfg||{};
  if(Cloud.on){ sheet(`<h2>Account</h2>
      <div class="field"><span>Signed in as</span><div class="note"><b style="color:var(--ink)">${esc(c.session.email||"")}</b> · ${esc(c.url.replace(/^https:\/\//,""))}</div></div>
      <div class="field"><span>Status</span><div class="note" id="acctStatus">${esc(cloudStatusText())}</div></div>
      <div class="field"><span>Another device</span><div class="note">Copy this setup code and paste it on your other device's sign-in screen, then use the same email and password. It holds your project address and public key, not your password.</div>
        <div class="row"><input type="text" id="acctCode" readonly value="${esc(setupCode(c))}" style="flex:1;min-width:0;font-family:var(--f-mono);font-size:12px"><button class="btn small" id="acctCopy" type="button">Copy</button></div></div>
      <div class="row"><button class="btn danger" id="acctOut" type="button">Sign out</button><div class="spacer"></div><button class="btn" data-close type="button">Close</button><button class="btn primary" id="acctSync" type="button">Sync now</button></div>`);
    $("#acctSync").onclick=()=>Cloud.sync();
    $("#acctCopy").onclick=async()=>{ const i=$("#acctCode"); try{ await navigator.clipboard.writeText(i.value); toast("Setup code copied"); }catch(e){ i.select(); } };
    $("#acctOut").onclick=()=>{ Cloud.signOut(); closeSheet(); toast("Signed out. Your library stays on this device."); };
    return; }
  sheet(`<h2>Sign in to sync</h2>
    <p class="note" style="margin:0">Keep your library, collections, MIDI files and scores the same on every device. Your library stays on this device too, so it works offline.</p>
    <label class="field">Setup code (optional)<input type="text" id="acCode" placeholder="Paste a code from your other device" autocomplete="off"></label>
    <label class="field">Supabase project URL<input type="text" id="acUrl" value="${esc(c.url||"")}" placeholder="https://abcdefgh.supabase.co" autocapitalize="off" autocomplete="off" spellcheck="false"></label>
    <label class="field">Public (anon) key<input type="text" id="acKey" value="${esc(c.key||"")}" placeholder="eyJhbGciOi… or sb_publishable_…" autocapitalize="off" autocomplete="off" spellcheck="false"></label>
    <label class="field">Email<input type="text" id="acEmail" inputmode="email" autocapitalize="off" autocomplete="username" spellcheck="false"></label>
    <label class="field">Password<input type="password" id="acPass" autocomplete="current-password" style="min-height:40px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 12px"></label>
    <div class="note" id="acMsg" role="status">${esc(Cloud.detail||"")}</div>
    <div class="row"><button class="btn" id="acCreate" type="button">Create account</button><div class="spacer"></div><button class="btn" data-close type="button">Cancel</button><button class="btn primary" id="acIn" type="button">Sign in</button></div>`);
  $("#acCode").oninput=e=>{ const v=readSetupCode(e.target.value); if(v){ $("#acUrl").value=v.u; $("#acKey").value=v.k; $("#acMsg").textContent="Project details filled in. Now enter your email and password."; } };
  const go=async create=>{ const msg=$("#acMsg"); const btns=[$("#acIn"),$("#acCreate")]; btns.forEach(b=>b.disabled=true); msg.textContent=create?"Creating your account…":"Signing in…";
    try{ await Cloud.signIn({url:$("#acUrl").value,key:$("#acKey").value,email:$("#acEmail").value,password:$("#acPass").value,create}); closeSheet(); toast(Cloud.state==="ok"?"Signed in · library synced":"Signed in"); renderLibrary(); }
    catch(e){ msg.textContent=e.message; btns.forEach(b=>b.disabled=false); } };
  $("#acIn").onclick=()=>go(false); $("#acCreate").onclick=()=>go(true);
}
function setupCode(c){ return "PR1."+btoa(JSON.stringify({u:c.url,k:c.key})); }
function readSetupCode(v){ try{ v=v.trim(); if(!v.startsWith("PR1.")) return null; const o=JSON.parse(atob(v.slice(4))); return o.u&&o.k?o:null; }catch(e){ return null; } }

/* ================= start-up ================= */
(async function boot(){
  await DB.open();
  try{ const st=(await DB.all("meta")).find(x=>x.id==="settings"); if(st){ const {id,...rest}=st; S.settings={...S.settings,...rest}; } }catch(e){}
  S.pieces=await DB.all("pieces"); S.collections=await DB.all("collections");
  if(!S.pieces.length&&!(await DB.all("meta")).some(x=>x.id==="seeded")){
    const p={id:uid(),title:"Five-finger warm-up",fileName:"sample.musicxml",xml:sampleXML(),added:Date.now(),tags:["warm-up"],attempts:[],lastPlayed:null,plays:0,settings:{},sample:true};
    const c={id:uid(),name:"Warm-ups",pieceIds:[p.id],created:Date.now(),sample:true};
    S.pieces.push(p); S.collections.push(c); await DB.put("pieces",p); await DB.put("collections",c); await DB.put("meta",{id:"seeded",at:Date.now()});
  }
  Kbd.build(); MidiIn.listeners.add(e=>Kbd.set(e.midi,"down",e.on));
  $("#strip").addEventListener("animationend",e=>e.currentTarget.classList.remove("flash"));
  renderLibrary(); MidiIn.init(); Audio.loadPiano();
  Cloud.load(); renderCloudPill(); $("#cloudPill").onclick=openAccount;
  if(Cloud.on) Cloud.sync();
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") Cloud.sync(); });
  window.addEventListener("online",()=>Cloud.sync());
  setInterval(()=>{ if(document.visibilityState==="visible"&&!S.running) Cloud.sync(); },60000);
})();
</script>
